<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e-Ayurvedic | Register</title>
  <link rel="stylesheet" href="/static/register.css">
</head>
<body>
  <div class="register-container">
    <form class="register-box" action="/adregister" method="POST">
      <h2><span class="leaf">🌿</span> e-Ayurvedic</h2>
      <h3>Create Your Account</h3>

      <input type="text" name="Full Name" placeholder="Full Name" required>
      <input type="number" name="Age"placeholder="Age" required>
      <input type="email" name="Email Address"placeholder="Email Address" required>
      <input type="tel" name="Phone Number"placeholder="Phone Number" pattern="[0-9]{10}" required>
      <input type="text" name="Username"placeholder="Username" required>
      <input type="password" name="Password"placeholder="Password" required>
      <input type="password" name="Confirm Password"placeholder="Confirm Password" required>

      <button type="submit">Register</button>

      <p class="login-link">
        Already have an account? <a href="admin_login.html">Login here</a>
      </p>
    </form>
  </div>
</body>
</html>
  <h2>Admin Registration</h2>
  {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
